name: Serafini CSV — Cboe equity root filter
on:
  push:
    branches: [main]
    paths:
      - cboe_csv_import.py
      - csv_market.py
      - tests/test_csv_root_filter.py
      - .github/workflows/csv-root-filter-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csv-roots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Cboe CSV parser syntax
        run: python -m py_compile cboe_csv_import.py csv_market.py
      - name: Verify NVDA Root All exclusion and malformed contract rejection
        run: python -m unittest discover -s tests -p test_csv_root_filter.py -v
