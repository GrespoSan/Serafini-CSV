name: CSV manual MT4 compatibility
on:
  push:
    paths:
      - 'app.py'
      - 'gamma_section.py'
      - 'mt4_manual.py'
      - 'tests/test_csv_manual_mt4.py'
      - '.github/workflows/csv-manual-mt4.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py gamma_section.py mt4_manual.py
      - run: python -m unittest discover -s tests -p test_csv_manual_mt4.py -v
