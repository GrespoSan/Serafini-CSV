name: Serafini CSV — OCC OI, estremi GEX e quotazione ES

on:
  pull_request:
    paths:
      - 'csv_gex_oi.py'
      - 'csv_gex_engine.py'
      - 'csv_gex_panel.py'
      - 'csv_gex_es_quote.py'
      - 'csv_gex_curve.py'
      - 'csv_gex_pine.py'
      - 'app.py'
      - 'tests/test_csv_gex_occ_extrema_es.py'
      - '.github/workflows/csv-gex-occ-es-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install math and calendar dependencies
        run: python -m pip install 'numpy>=2,<3' 'exchange_calendars>=4.6,<5' 'pandas>=2.1,<3'
      - name: Install UI rendering dependencies
        run: python -m pip install 'streamlit>=1.52,<2' 'plotly>=5.20,<7'
      - name: Compile OI, extrema, ES quote, source/UI/Pine
        run: python -m py_compile csv_gex_oi.py csv_gex_engine.py csv_gex_panel.py csv_gex_es_quote.py csv_gex_curve.py csv_gex_pine.py app.py
      - name: Import actual Streamlit panel and render Plotly ES/peak lines
        run: |
          python - <<'PY'
          from csv_gex_panel import _curve_chart
          grid=[{"spot":7232+0.1*i,"net_gex":(i-100)*1e7} for i in range(201)]
          report={"curve":grid,"call_wall":7248,"put_wall":7238,"flip":7240}
          quote={"price":7261.25,"symbol":"ESZ26.CME"}
          fig=_curve_chart(report,7242,symbol="SPX",es_spx_basis=17,es_quote=quote)
          traces={t.name:t for t in fig.data}
          assert len(fig.data)==8, len(fig.data)
          marks=[t for t in fig.data if t.name.startswith("ES Yahoo") and t.mode=="markers"]
          assert len(marks)==1 and marks[0].x[0]==7261.25, "Actual ES mark missing"
          assert traces["Picco MAX"].x[0]==7269.0
          assert traces["Spot modello GEX · ES equivalente"].x[0]==7259.0
          print("STREAMLIT_PLOTLY_ES_AND_EXTREMA_OK")
          PY
      - name: New OCC source / futures quote / extrema no-network regression
        run: python -m unittest discover -s tests -p test_csv_gex_occ_extrema_es.py -v
      - name: Preserve original GEX/Pine and automatic GEX wiring
        run: |
          python -m unittest discover -s tests -p test_csv_gex_integration.py -v
          python -m unittest discover -s tests -p test_csv_gex_automatic_flow.py -v
          python -m unittest discover -s tests -p test_csv_gex_pine.py -v
          python -m unittest discover -s tests -p test_csv_gex_quality_gate.py -v
          python -m unittest discover -s tests -p test_csv_gex_es_display.py -v
