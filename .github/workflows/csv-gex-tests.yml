name: Serafini CSV — GEX indipendente
on:
  push:
    branches: [main]
    paths:
      - app.py
      - us_market_calendar.py
      - csv_gex_engine.py
      - csv_gex_panel.py
      - csv_gex_source_display.py
      - csv_gex_services.py
      - csv_gex_oi.py
      - csv_gex_curve.py
      - csv_gex_es_quote.py
      - csv_gex_quote_cache.py
      - gamma_es_quote_overlay.py
      - csv_gex_price_display.py
      - csv_gex_pine.py
      - mercati/pine_ui.py
      - gamma_section.py
      - net_gamma.py
      - serafini_sigma.py
      - pine_export.py
      - mercati/v2_market_engine.py
      - mercati/v2_index_market_view.py
      - mercati/gld_cboe_view.py
      - mercati/uso_cboe_view.py
      - mercati/v2_universal_cboe.py
      - csv_gex_core/**
      - cboe_csv_import.py
      - tests/test_csv_gex_integration.py
      - tests/test_csv_gex_iv_inference.py
      - tests/test_csv_gex_pine.py
      - tests/test_csv_gex_es_display.py
      - tests/test_csv_gex_chart_layout.py
      - tests/test_csv_gex_dual_cards.py
      - tests/test_gamma_es_quote_overlay.py
      - tests/test_csv_gex_automatic_flow.py
      - tests/test_csv_gex_service_import.py
      - tests/test_csv_gex_quality_gate.py
      - tests/test_csv_gex_occ_extrema_es.py
      - tests/test_csv_gex_source_display.py
      - tests/test_net_gamma_dynamic_extension.py
      - tests/test_pine_weekly_only.py
      - tests/test_us_market_calendar.py
      - tests/test_serafini_recent_rth.py
      - .github/workflows/csv-gex-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pure model and calendar dependencies
        run: python -m pip install 'numpy>=2,<3' 'exchange_calendars>=4.6,<5' 'pandas>=2.1,<3' 'streamlit>=1.52,<2' 'plotly>=5.20,<7'
      - name: Compile all GEX files and unchanged CSV imports
        run: python -m compileall -q csv_gex_core csv_gex_engine.py csv_gex_panel.py csv_gex_source_display.py csv_gex_services.py csv_gex_oi.py csv_gex_curve.py csv_gex_es_quote.py csv_gex_quote_cache.py gamma_es_quote_overlay.py csv_gex_price_display.py csv_gex_pine.py mercati/pine_ui.py gamma_section.py net_gamma.py serafini_sigma.py pine_export.py mercati/v2_market_engine.py mercati/v2_index_market_view.py mercati/gld_cboe_view.py mercati/uso_cboe_view.py mercati/v2_universal_cboe.py cboe_csv_import.py us_market_calendar.py app.py
      - name: Calendario automatico USA nel CONTESTO, Thanksgiving e Black Friday Roma
        run: python -m unittest discover -s tests -p test_us_market_calendar.py -v
      - name: Import Smoke Streamlit GEX service/UI e isolamento NET GAMMA
        run: python -m unittest discover -s tests -p test_csv_gex_service_import.py -v
      - name: Provenienza GEX CSV OCC orari Roma, nessun feed Alpaca e fallback
        run: python -m unittest discover -s tests -p test_csv_gex_source_display.py -v
      - name: Golden Edge formulas and CSV source/quality regression
        run: python -m unittest discover -s tests -p test_csv_gex_integration.py -v
      - name: IV auto recognition with outlier and mixed-unit regression
        run: python -m unittest discover -s tests -p test_csv_gex_iv_inference.py -v
      - name: Gate GEX Edge reale e scenario 360 su 387 contratti
        run: python -m unittest discover -s tests -p test_csv_gex_quality_gate.py -v
      - name: OCC OI dated download source, genuine ES delayed quote, extrema and fallbacks
        run: python -m unittest discover -s tests -p test_csv_gex_occ_extrema_es.py -v
      - name: Estensione grafica dinamica NET GAMMA e validazione Pine 200 strike
        run: python -m unittest discover -s tests -p test_net_gamma_dynamic_extension.py -v
      - name: Estensione NET GAMMA su 5 sedute RTH verificate, no lookahead e fallback
        run: python -m unittest discover -s tests -p test_serafini_recent_rth.py -v
      - name: Pine NET GAMMA Weekly-only per mancanza 0DTE, GEX separato
        run: python -m unittest discover -s tests -p test_pine_weekly_only.py -v
      - name: Pine GEX controls, source identity, no data fabrication and price conversion
        run: python -m unittest discover -s tests -p test_csv_gex_pine.py -v
      - name: Single CSV automatic GEX and Pine integration
        run: python -m unittest discover -s tests -p test_csv_gex_automatic_flow.py -v
      - name: GEX SPX solo livelli ES e curve convertite con basis corrente
        run: python -m unittest discover -s tests -p test_csv_gex_es_display.py -v
      - name: Schede GEX Daily/Weekly indipendenti con N/D e grafici solo 0DTE
        run: python -m unittest discover -s tests -p test_csv_gex_dual_cards.py -v
      - name: Grafici GEX Plotly leggibili, legenda curva e selezione range strike
        run: python -m unittest discover -s tests -p test_csv_gex_chart_layout.py -v
      - name: Prezzo ES Yahoo su 0DTE e Weekly, GEX peak labels e linee % OFF
        run: python -m unittest discover -s tests -p test_gamma_es_quote_overlay.py -v
      - name: Pre-existing root-filter regression
        run: python -m unittest discover -s tests -p test_csv_root_filter.py -v
