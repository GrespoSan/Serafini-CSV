name: Serafini CSV — GEX indipendente
on:
  push:
    branches: [main]
    paths:
      - app.py
      - csv_gex_engine.py
      - csv_gex_panel.py
      - csv_gex_core/**
      - cboe_csv_import.py
      - tests/test_csv_gex_integration.py
      - .github/workflows/csv-gex-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pure model and calendar dependencies
        run: python -m pip install 'numpy>=2,<3' 'exchange_calendars>=4.6,<5' 'pandas>=2.1,<3'
      - name: Compile all GEX files and unchanged CSV imports
        run: python -m compileall -q csv_gex_core csv_gex_engine.py csv_gex_panel.py cboe_csv_import.py app.py
      - name: Golden Edge formulas and CSV source/quality regression
        run: python -m unittest discover -s tests -p test_csv_gex_integration.py -v
      - name: Pre-existing root-filter regression
        run: python -m unittest discover -s tests -p test_csv_root_filter.py -v
